[package]
name = "translator"
version = "1.0.0"
edition = "2021"

[dependencies]
ct2rs = { version = "0.9", features = ["sentencepiece"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
